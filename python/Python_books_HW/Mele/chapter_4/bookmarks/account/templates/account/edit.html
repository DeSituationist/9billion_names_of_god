{% extends 'base.html' %}

{% block title %}Edit ur account{% endblock %}

{% block content %}
    <h1>Edit ur account</h1>
    <p>You can edit ur account using the following form:</p>
    <form method="post" enctype="multipart/form-data">
        {{ user_form.as_p }}
        {{ profile_form.as_p }}
        {% csrf_token %}
        <p><input type="submit" value="Save changes"></p>
    </form>
{% endblock %}
