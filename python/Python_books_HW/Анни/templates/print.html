{% extends 'base.html' %}
{% block content %}
<h1>Thank you for ordering {{order['name']}}:</h1>
<p>Your drink: <strong>{{order['drink']}}</strong></p>
<p>Your flavor: <strong>{{order['flavor']}}</strong></p>
<p>Your topping: <strong>{{order['topping']}}</strong></p>
<form action="/order"><input type="submit" value="New Order"></form>
<form action="/list"><input type="submit" value="Check Orders"></form>
{% endblock %}
