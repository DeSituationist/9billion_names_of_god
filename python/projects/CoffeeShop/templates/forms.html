{% extends 'base.html' %}

{% block content %}
<h1>Choose your drink</h1>
<form action="/order/confirm" method="post">
    <input type="text" name="name" placeholder="Enter your name:">
    <select name="drink">
        <option value="nothing">- Choose a drink -</option>
        {% for drink in drinks %}
        <option value="{{ drink }}">{{ drink }}</option>
        {% endfor %}
    </select>
    <select name="flavor">
        <option value="no flavor">- Choose a flavor -</option>
        {% for flavor in flavors %}
        <option value="{{ flavor }}">{{ flavor }}</option>
        {% endfor %}
    </select>
    <select name="topping">
        <option value="no topping">- Choose a topping -</option>
        {% for topping in toppings %}
        <option value="{{ topping }}">{{ topping }}</option>
        {% endfor %}
    </select>
    <input class="btn forms" type="submit" value="Confirm">
</form>
{% endblock %}
