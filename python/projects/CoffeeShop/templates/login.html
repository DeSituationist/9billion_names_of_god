{% extends 'base.html' %}

{% block content %}
<h1 class="centered">Login into your Account</h1>
<p>☕ Welcome to the Coffee Club ☕</p>

{% if error %}
<p style="color: red; font-weight: 600;">{{ error }}</p>
{% endif %}
{% if success %}
<p style="color: green; font-weight: 600;">{{ success }}</p>
{% endif %}

<form action="{{ url_for('login') }}" method="post">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <input class="btn forms" type="submit" value="Login">
</form>
<a href="{{ url_for('account_creation') }}" class="btn forms" style="margin-top: 12px;">Create Account</a>
{% endblock %}
